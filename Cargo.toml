[workspace]
members = [
  "crates/core",
  "crates/builder",
  "crates/verifier",
  "crates/cli",
  "crates/tests/invariants",
  "app/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.96.0"
license = "UNLICENSED"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
