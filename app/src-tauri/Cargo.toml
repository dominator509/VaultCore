[package]
name = "vaultcore-app"
version = "0.1.0"
description = "VaultCore desktop shell"
authors = ["VaultCore"]
edition = "2021"
rust-version = "1.96.0"
publish = false
default-run = "vaultcore-app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
vaultcore-builder = { path = "../../crates/builder" }
vaultcore-core = { path = "../../crates/core" }
